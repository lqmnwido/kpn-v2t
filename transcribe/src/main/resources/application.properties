# Server
server.port=${SERVER_PORT:8082}

# Application
spring.application.name=temporal-worker

# Temporal
spring.temporal.namespace=${TEMPORAL_NAMESPACE:default}
spring.temporal.connection.target=${TEMPORAL_TARGET:127.0.0.1:7233}

# Temporal Workers
spring.temporal.workers[0].name=workflowWorker
spring.temporal.workers[0].task-queue=${TEMPORAL_WORKFLOW_TASK_QUEUE:ASR_WORKFLOW_QUEUE}
spring.temporal.workers[0].workflow-classes[0]=com.example.asr.worker.workflow.AsrWorkflowImpl

spring.temporal.workers[1].name=mediaWorker
spring.temporal.workers[1].task-queue=${TEMPORAL_MEDIA_TASK_QUEUE:MEDIA_TASK_QUEUE}
spring.temporal.workers[1].activity-beans[0]=mediaActivitiesImpl

spring.temporal.workers[2].name=asrWorker
spring.temporal.workers[2].task-queue=${TEMPORAL_ASR_TASK_QUEUE:ASR_TASK_QUEUE}
spring.temporal.workers[2].activity-beans[0]=asrActivitiesImpl
spring.temporal.workers[2].activity-beans[1]=diarizationActivitiesImpl
spring.temporal.workers[2].activity-beans[2]=speakerRefinementActivitiesImpl
spring.temporal.workers[2].activity-beans[3]=lockActivitiesImpl

# Management / Actuator
management.endpoints.web.exposure.include=health,info

# MinIO
app.minio.url=${MINIO_URL:http://127.0.0.1:9000}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}
app.minio.bucket=${MINIO_BUCKET:asr-poc}

# Ollama
app.ollama.host=${OLLAMA_HOST:http://127.0.0.1:11434}
app.ollama.model=${OLLAMA_MODEL:llama3.2:3b}

# Tools / Scripts
app.tools.ffmpeg-path=${FFMPEG_PATH:/usr/bin/ffmpeg}
app.tools.ffprobe-path=${FFPROBE_PATH:/usr/bin/ffprobe}
app.tools.python-executable=${PYTHON_EXECUTABLE:python/venv/bin/python}
app.tools.diarize-script-path=${DIARIZE_SCRIPT_PATH:python/diarize_and_match.py}
app.tools.refine-script-path=${REFINE_SCRIPT_PATH:python/refine_speakers.py}
app.tools.working-dir=${ASR_WORK_DIR:/tmp/temporal-asr-poc}
app.tools.chunk-seconds=${ASR_CHUNK_SECONDS:30}
